name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      # Unit + fake-harness tests, quality gates (Spotless, JaCoCo, Enforcer) and the
      # Docker e2e against the default (3.x) Kafka worker image.
      - name: Build and test
        run: mvn clean verify --batch-mode --no-transfer-progress

      # The configuration reference is generated from ConfigDef by the e2e module;
      # a config change must ship with its regenerated docs.
      - name: Generated configuration reference is committed
        run: git diff --exit-code -- website/docs/reference/configuration

      - name: Confluent migration tooling self-test
        run: python3 tools/confluent-migration/selftest.py

      - name: Upload connector plugin ZIPs
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: connect-plugin-zips
          path: '**/target/*-kafka-connect-plugin.zip'
          retention-days: 14

      # Executable proof that the documented Confluent cutover procedure loses no
      # rows, regenerated by ConfluentCutoverMigrationTest on every build.
      - name: Upload migration evidence report
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: migration-evidence
          path: connect-servicenow-source/target/migration-evidence.json
          retention-days: 90

  # The same packaged plugins on a Kafka 4.x worker with plugin.discovery=service_load.
  e2e-kafka-4:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kafka-image: ['apache/kafka:4.1.0']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Package and run the Docker e2e on ${{ matrix.kafka-image }}
        run: >-
          mvn clean verify --batch-mode --no-transfer-progress
          -DskipUnitTests=true
          -De2e.kafka.image=${{ matrix.kafka-image }}
