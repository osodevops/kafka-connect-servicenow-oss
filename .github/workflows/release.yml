name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
      tag_name:
        description: 'Git tag (defaults to v<version>)'
        required: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      tag_name:
        type: string
        required: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: resolve
        run: |
          VERSION="${{ inputs.version || github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "Refusing to release a SNAPSHOT version: $VERSION" >&2
            exit 1
          fi
          TAG="${{ inputs.tag_name }}"
          [ -z "$TAG" ] && TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Verify checked-in version matches the release
        run: |
          POM_VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [ "$POM_VERSION" != "${{ steps.resolve.outputs.version }}" ]; then
            echo "pom.xml version $POM_VERSION != release ${{ steps.resolve.outputs.version }}" >&2
            exit 1
          fi

      # release-please bumps every module POM; make sure none was left behind.
      - name: Verify every reactor module is at the release version
        run: |
          mvn -q --batch-mode --no-transfer-progress \
            org.codehaus.mojo:exec-maven-plugin:3.5.0:exec \
            -Dexec.executable=echo -Dexec.args='${project.artifactId} ${project.version}' \
            > /tmp/reactor-versions.txt
          cat /tmp/reactor-versions.txt
          if grep -v " ${{ steps.resolve.outputs.version }}$" /tmp/reactor-versions.txt; then
            echo "One or more modules are not at ${{ steps.resolve.outputs.version }}" >&2
            exit 1
          fi

      - name: Build and test
        run: mvn clean verify --batch-mode --no-transfer-progress

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag_name }}

      - name: Set up JDK 17 for publishing
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Deploy to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME || secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN || secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn clean deploy \
            --batch-mode \
            --no-transfer-progress \
            -Prelease \
            -DskipTests

      # Build once, publish the same files: SHA-256 per ZIP plus the CycloneDX SBOM
      # produced by the release profile (target/bom.json).
      - name: Checksums and SBOM
        run: |
          for z in $(find . -path '*/target/*-kafka-connect-plugin.zip'); do
            (cd "$(dirname "$z")" && sha256sum "$(basename "$z")" > "$(basename "$z").sha256")
          done
          cp target/bom.json "target/kafka-connect-servicenow-${{ needs.validate.outputs.version }}-bom.json"
          find . -path '*/target/*-kafka-connect-plugin.zip*' -o -path './target/*-bom.json' | sort

      - name: Attach connector plugin ZIPs, checksums and SBOM to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag_name }}
          files: |
            **/target/*-kafka-connect-plugin.zip
            **/target/*-kafka-connect-plugin.zip.sha256
            target/kafka-connect-servicenow-*-bom.json
