# Local Kafka + Kafka Connect with the ServiceNow connector plugins mounted.
#
#   mvn clean package -DskipTests
#   mkdir -p plugins && for z in ../*/target/*-kafka-connect-plugin.zip; do unzip -o "$z" -d plugins/; done
#
# Against a real instance (credentials in ./secrets/snow.properties, see secrets.properties.example):
#   docker compose up -d
#   curl -s -X POST -H 'Content-Type: application/json' --data @source-connector.json localhost:8083/connectors
#
# With no ServiceNow at all, the "fake" profile runs the same fake ServiceNow the test suite
# uses (Basic user connect/secret, seeded incident rows). Two steps, the first builds
# fake-servicenow/lib/ from the snow-core test-jar:
#   ./fake-servicenow/build.sh && docker compose --profile fake up -d
#   curl -s -X POST -H 'Content-Type: application/json' --data @source-connector-fake.json localhost:8083/connectors
#   docker compose exec kafka /opt/kafka/bin/kafka-console-consumer.sh \
#     --bootstrap-server localhost:19092 --topic servicenow.incident --from-beginning
#
# Stop everything (both profiles): docker compose --profile fake down -v
services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  connect:
    image: confluentinc/cp-kafka-connect:7.7.1
    depends_on:
      - kafka
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:19092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: snow-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      # ${file:/secrets/snow.properties:key} references in the production connector JSON
      CONNECT_CONFIG_PROVIDERS: file
      CONNECT_CONFIG_PROVIDERS_FILE_CLASS: org.apache.kafka.common.config.provider.FileConfigProvider
      CONNECT_PLUGIN_PATH: /usr/share/java,/etc/kafka-connect/plugins
    volumes:
      - ./plugins:/etc/kafka-connect/plugins
      - ./secrets:/secrets:ro

  # Fake ServiceNow (WireMock Table API + OAuth token endpoint from the snow-core test-jar).
  # Only started with: docker compose --profile fake up -d   (after ./fake-servicenow/build.sh)
  servicenow-fake:
    build: ./fake-servicenow
    profiles: ["fake"]
    ports:
      - "8090:8090"
    command: ["--port", "8090"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8090"]
      interval: 5s
      timeout: 3s
      retries: 12
